<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ClickMAG</title>
    
    <!-- الربط مع ملف Manifest الخاص بالتطبيق -->
    <link rel="manifest" href="manifest.json">
    
    <!-- الربط مع ملف الـ CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبة قراءة الباركود -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <script src="script.js"></script>


    <!-- زر الإعدادات -->
    <button onclick="openSettingsModal()" class="settings-btn">⚙️</button>

    <!-- واجهة الماسح الضوئي وعرض النتائج -->
    <div id="reader"></div>
    <div id="product-result"></div>

    <!-- نافذة الإعدادات (Modal) -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Paramètres de connexion</h3>
            
            <label for="cfg-ip">IP de la caisse :</label>
            <input type="text" id="cfg-ip">
            
            <label for="cfg-port">Port :</label>
            <input type="text" id="cfg-port">
            
            <label class="checkbox-label">
                <input type="checkbox" id="cfg-demo"> Mode Démo (sans caisse)
            </label>
            
            <div class="modal-actions">
                <button onclick="closeSettingsModal()" class="btn-cancel">Annuler</button>
                <button onclick="saveConfig()" class="btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- الربط مع ملف الـ JavaScript -->
    <script src="script.js"></script>

</body>
</html>
