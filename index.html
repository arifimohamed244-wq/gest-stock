<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ClickMAG</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 15px; text-align: center; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; }
        .product-card { background: white; padding: 20px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: left; direction: ltr; }
        .product-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; color: #333; }
        .stock-info { border-bottom: 1px solid #eee; padding: 8px 0; color: #555; }
    </style>
</head>
<body>

<!-- زر الإعدادات -->
<button onclick="openSettingsModal()" style="position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 24px; cursor: pointer;">⚙️</button>

<!-- واجهة الماسح الضوئي -->
<div id="reader"></div>
<div id="product-result"></div>

<!-- نافذة الإعدادات -->
<div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="background: white; margin: 20% auto; padding: 20px; width: 85%; max-width: 350px; border-radius: 12px; text-align: left;">
        <h3>Paramètres de connexion</h3>
        <label>IP de la caisse :</label>
        <input type="text" id="cfg-ip" style="width: 100%; margin-bottom: 10px;">
        <label>Port :</label>
        <input type="text" id="cfg-port" style="width: 100%; margin-bottom: 10px;">
        <label><input type="checkbox" id="cfg-demo"> Mode Démo (sans caisse)</label>
        <div style="margin-top: 15px; display: flex; justify-content: space-between;">
            <button onclick="closeSettingsModal()">Annuler</button>
            <button onclick="saveConfig()">Enregistrer</button>
        </div>
    </div>
</div>

<script>
    // --- منطق الإعدادات ---
    const DEFAULT_CONFIG = { ip: "192.168.1.15", port: "4900", useDemo: true };
    function getConfig() { return JSON.parse(localStorage.getItem('forYou_app_config')) || DEFAULT_CONFIG; }
    
    function saveConfig() {
        const config = { ip: document.getElementById('cfg-ip').value, port: document.getElementById('cfg-port').value, useDemo: document.getElementById('cfg-demo').checked };
        localStorage.setItem('forYou_app_config', JSON.stringify(config));
        alert("Enregistré avec succès !");
        closeSettingsModal();
    }

    function openSettingsModal() {
        const config = getConfig();
        document.getElementById('cfg-ip').value = config.ip;
        document.getElementById('cfg-port').value = config.port;
        document.getElementById('cfg-demo').checked = config.useDemo;
        document.getElementById('settings-modal').style.display = 'block';
    }
    function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

    // --- منطق البحث والماسح ---
    async function fetchProductDetails(barcode) {
        const config = getConfig();
        const resDiv = document.getElementById('product-result');
        resDiv.innerHTML = "Recherche en cours...";

        if (config.useDemo) {
            const demoData = { 
                "468": { name: "Chemise Classique", variants: [{ color: "Bleu", size: "M", quantity: 4 }] }, 
                "275": { name: "Jean Classique", variants: [{ color: "Gris", size: "40", quantity: 2 }] } 
            };
            if (demoData[barcode]) renderCard(demoData[barcode]);
            else resDiv.innerHTML = "Produit non trouvé en mode démo";
        } else {
            try {
                const res = await fetch(`http://${config.ip}:${config.port}/api/product/${barcode}`);
                const data = await res.json();
                renderCard(data);
            } catch(e) { resDiv.innerHTML = "Erreur de connexion avec la caisse"; }
        }
    }

    function renderCard(p) {
        document.getElementById('product-result').innerHTML = `
            <div class="product-card">
                <div class="product-title">${p.name}</div>
                ${p.variants.map(v => `<div class="stock-info">Couleur: ${v.color} | Taille: ${v.size} | Qté: ${v.quantity}</div>`).join('')}
            </div>`;
    }

    // تشغيل الكاميرا
    new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }).render((text) => fetchProductDetails(text));
</script>
</body>
</html>
