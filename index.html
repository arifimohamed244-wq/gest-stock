<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ClickMAG</title>
    <!-- الربط مع ملف Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- الربط مع CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة قراءة الباركود -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- زر الإعدادات -->
    <button onclick="openSettingsModal()" class="settings-btn">⚙️</button>

    <div class="container">
        <h2>Scanner ClickMAG</h2>

        <!-- منطقة البحث اليدوي والكشاف -->
        <div class="controls-section">
            <div class="manual-search">
                <input type="text" id="manual-code" placeholder="أدخل الكود يدوياً...">
                <button onclick="manualSearch()">بحث</button>
            </div>
            
            <button id="torch-btn" onclick="toggleFlashlight()" class="torch-btn">
                🔦 تشغيل الكشاف
            </button>
        </div>

        <!-- واجهة الماسح الضوئي -->
        <div id="reader"></div>
        
        <!-- منطقة عرض النتائج -->
        <div id="product-result"></div>
    </div>

    <!-- نافذة الإعدادات (Modal) -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Paramètres de connexion</h3>
            
            <label for="cfg-ip">IP de la caisse :</label>
            <input type="text" id="cfg-ip">

            <label for="cfg-port">Port :</label>
            <input type="text" id="cfg-port">

            <label class="checkbox-label">
                <input type="checkbox" id="cfg-demo"> Mode Démo
            </label>

            <div class="modal-actions">
                <button onclick="closeSettingsModal()" class="btn-cancel">Annuler</button>
                <button onclick="saveConfig()" class="btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
