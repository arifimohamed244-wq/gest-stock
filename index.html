
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص مخزون ClickMAG</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; text-align: center; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: 15px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .badge { display: inline-block; padding: 6px 12px; background: #007bff; color: white; border-radius: 20px; font-weight: bold; }
        .stock { font-size: 1.5rem; color: #28a745; font-weight: bold; margin-top: 10px; }
        .out-of-stock { color: #dc3545; }
    </style>
</head>
<body>
  <!-- زر الإعدادات والنافذة المنبثقة -->
  <button onclick="openSettingsModal()" style="position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 22px; cursor: pointer;">⚙️</button>
  
  <div id="settings-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
    <div style="background: white; margin: 20% auto; padding: 20px; width: 85%; max-width: 350px; border-radius: 12px; text-align: right; direction: rtl;">
      <h3>إعدادات الاتصال</h3>
      <label>IP الكاشة:</label>
      <input type="text" id="cfg-ip" style="width: 100%; padding: 8px; margin-bottom: 10px;">
      <label>المنفذ (Port):</label>
      <input type="text" id="cfg-port" style="width: 100%; padding: 8px; margin-bottom: 10px;">
      <label><input type="checkbox" id="cfg-demo"> الوضع التجريبي</label>
      <div style="margin-top: 15px; text-align: left;">
        <button onclick="closeSettingsModal()">إلغاء</button>
        <button onclick="saveConfig(document.getElementById('cfg-ip').value, document.getElementById('cfg-port').value, document.getElementById('cfg-demo').checked)">حفظ</button>
      </div>
    </div>
  </div>

  <div id="product-result"></div>

  <script>
    // الإعدادات الافتراضية
    const DEFAULT_CONFIG = { ip: "192.168.1.15", port: "4900", useDemo: true };

    function getConfig() {
      const saved = localStorage.getItem('forYou_app_config');
      return saved ? JSON.parse(saved) : DEFAULT_CONFIG;
    }

    function saveConfig(ip, port, useDemo) {
      localStorage.setItem('forYou_app_config', JSON.stringify({ ip, port, useDemo }));
      alert("تم الحفظ!");
      closeSettingsModal();
    }

    function openSettingsModal() {
      const config = getConfig();
      document.getElementById('cfg-ip').value = config.ip;
      document.getElementById('cfg-port').value = config.port;
      document.getElementById('cfg-demo').checked = config.useDemo;
      document.getElementById('settings-modal').style.display = 'block';
    }

    function closeSettingsModal() { document.getElementById('settings-modal').style.display = 'none'; }

    // دالة البحث (تجريبي + حقيقي)
    async function fetchProductDetails(barcode) {
      const config = getConfig();
      if (config.useDemo) {
        // ضع هنا الباركودات التجريبية
        const demoData = { "468": { name: "قميص كلاسيك", variants: [{ color: "أزرق", size: "M", quantity: 4 }] } };
        if (demoData[barcode]) renderProductCard(demoData[barcode]);
        else alert("غير موجود تجريبياً");
      } else {
        try {
          const res = await fetch(`http://${config.ip}:${config.port}/api/product/${barcode}`);
          const data = await res.json();
          renderProductCard(data);
        } catch(e) { alert("تعذر الاتصال بالكاشة"); }
      }
    }

    function renderProductCard(product) {
       document.getElementById('product-result').innerHTML = `<div>${product.name}</div>`;
    }
  </script>

</body>
</html>
