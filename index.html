<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ClickMAG</title>
    <!-- Lien Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <!-- Lien CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Bibliothèque Scanner QR & Barcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <!-- Bouton Paramètres -->
    <button onclick="openSettingsModal()" class="settings-btn">⚙️</button>

    <div class="container">
        <h2>Scanner ClickMAG</h2>

        <!-- Recherche manuelle & Lampe torche -->
        <div class="controls-section">
            <div class="manual-search">
                <input type="text" id="manual-code" placeholder="Saisir le code manuellement...">
                <button onclick="manualSearch()">Chercher</button>
            </div>
            
            <button id="torch-btn" onclick="toggleFlashlight()" class="torch-btn">
                🔦 Activer la lampe
            </button>
        </div>

        <!-- Zone du Scanner Caméra -->
        <div id="reader"></div>
        
        <!-- Zone d'affichage des résultats -->
        <div id="product-result"></div>
    </div>

    <!-- Fenêtre des Paramètres (Modal) -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Paramètres de connexion</h3>
            
            <label for="cfg-ip">Adresse IP de la caisse :</label>
            <input type="text" id="cfg-ip" placeholder="ex: 192.168.1.50">

            <label for="cfg-port">Port :</label>
            <input type="text" id="cfg-port" placeholder="ex: 8080">

            <label class="checkbox-label">
                <input type="checkbox" id="cfg-demo"> Mode Démo
            </label>

            <div class="modal-actions">
                <button onclick="closeSettingsModal()" class="btn-cancel">Annuler</button>
                <button onclick="saveConfig()" class="btn-save">Enregistrer</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
